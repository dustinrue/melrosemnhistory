name: Deploy to Cloudflare Pages

# Every push to main (i.e. every merged pull request) publishes the site to
# https://www.melrosemnhistory.com. Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.melrosemnhistory.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require the Cloudflare token
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
      - name: Build, verify and deploy (scripts/deploy.sh runs npm run verify first)
        run: scripts/deploy.sh production
      - name: Smoke test the live site
        run: node scripts/smoke-test.mjs https://www.melrosemnhistory.com
