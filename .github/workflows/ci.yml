name: CI

# Runs on every pull request: build + safety checks, a design-zone guard for "content" PRs,
# and a noindex preview deployment you can open before merging.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and check (schemas, links, alt text, CSS assets, canonicals)
        run: npm run verify

  # Add the "content" label to a PR to assert it only changes content files (src/data, src/content,
  # src/assets/photos, public). Fails if it touches layouts, components, styles, pages, scripts or config.
  content-guard:
    if: contains(github.event.pull_request.labels.*.name, 'content')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-content-only.sh "origin/${{ github.base_ref }}"

  preview:
    needs: verify
    # Secrets are not available to PRs from forks; skip there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The CLOUDFLARE_API_TOKEN secret is stored in the GitHub environment named "main".
    environment: main
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require the Cloudflare token
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
      - name: Deploy preview (noindex)
        run: scripts/deploy.sh preview
      - name: Smoke test the preview
        run: node scripts/smoke-test.mjs "https://${PREVIEW_BRANCH}.melrosemnhistory.pages.dev" --noindex-ok
      - name: Link to the preview
        run: |
          {
            echo "### Preview ready"
            echo "https://${PREVIEW_BRANCH}.melrosemnhistory.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"
